services:
  bapp:
    build:
      context: .
      dockerfile: .devcontainer/Dockerfile
    image: bapp-dev:latest
    container_name: bapp-dev
    ports:
      - "8000:8000"
    volumes:
      - .:/home/vscode/workspace:cached
      - venv:/home/vscode/workspace/.venv
    entrypoint: []
    command: sleep infinity
    healthcheck:
      disable: true


volumes:
  venv: