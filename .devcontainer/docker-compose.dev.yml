services:
  bapp-dev:
    build:
      context: .
      dockerfile: .devcontainer/Dockerfile
      args: 
        - CA_CERT=${CA_CERT} 
    image: bapp-dev:latest
    ports:
      - "8000:8000"
    networks:
      - bapp
    volumes:
      - .:/home/vscode/workspace:cached
      - venv:/home/vscode/workspace/.venv
    entrypoint: []
    command: sleep infinity
    healthcheck:
      disable: true

  gotenberg:
    image: gotenberg/gotenberg:8
    networks:
      - bapp
    restart: unless-stopped
    environment:
      - CHROMIUM_IGNORE_CERTIFICATE_ERRORS=true  # required to fetch the bootstrap files

networks:
  bapp:

volumes:
  venv: