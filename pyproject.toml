[project]
name = "bApp"
version = "0.1.1"
readme = "README.md"
authors = [
    {name = "Philip Becker", email = "yummytea1@gmail.com"},
]
requires-python = ">= 3.10"
dependencies = [
    "django-bootstrap5==25.3",
    "Django==5.2.7",
    "mizdb_tomselect==0.11.0",
    "django-soft-delete==1.0.22",
    "mod_wsgi==5.0.2",
    "requests==2.32.5",
    "pillow>=12.2.0",
]

[dependency-groups]
dev = [
    {include-group = "lint"},
    {include-group = "test"},
    {include-group = "docs"},
    "poethepoet>=0.42.1",
]
lint = [
    "ruff",
    "djlint",
]
test = [
    "coverage",
    "pytest",
    "pytest-cov",
    "pytest-django",
    "pytest-xdist",
    "factory-boy",
    "beautifulsoup4",
]
docs = [
    "mkdocs",
]

[tool.ruff]
target-version = "py313"
line-length = 120
extend-exclude = ["**/migrations/**"]

[tool.lint]
select = [
    "D",        # pydocstyle
    "E", "W",   # pycodestyle
    "F",        # flake8
    "I",        # isort
]
ignore = [
    "D1",    # D1: Missing docstring error codes (because not every function and class has a docstring)
    "D203",  # D203: 1 blank line required before class docstring (conflicts with D211 and should be disabled, see https://github.com/PyCQA/pydocstyle/pull/91)
    "D205",  # D205: 1 blank line required between summary line and description
    "D212",  # D212: Multi-line docstring summary should start at the first line
]

[tool.lint.pydocstyle]
convention = "google"

[tool.lint.pycodestyle]
max-doc-length = 88

[tool.lint.isort]
known-first-party = ["web", "bapp"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "tests.settings"

[tool.coverage.run]
omit = [
    "web/migrations/*",
    "bapp/*",
    "manage.py",
    "tests/*",
]

[tool.djlint]
max_line_length=200
ignore="H021,H030,H031"


[tool.poe.tasks.server]
help = "Run the Django development server"
cmd = "uv run manage.py runserver 0.0.0.0:8000"

[tool.poe.tasks.shell]
help = "Run interactive interpreter for this Django project"
cmd = "uv run manage.py shell"

[tool.poe.tasks.test]
help = "Run pytest tests with coverage"
cmd = "uv run pytest --cov --cov-report=html --cov-branch"

[tool.poe.tasks.qtest]
help = "(quickly) Run pytest tests, but without coverage to speed things up"
cmd = "uv run pytest"

[tool.poe.tasks.ruff]
help = "Run ruff linter und formatter and fix found issues"
shell = "uv run ruff check --fix .; uv run ruff format"

[tool.poe.tasks.ruff-check]
help = "Run ruff check"
shell = "uv run ruff check ."

[tool.poe.tasks.dump]
help = "Dump the database to a JSON file"
cmd = "uv run manage.py dumpdata --indent 2  -e sessions -e contenttypes"

[tool.poe.tasks.load]
help = "Load a fixture from standard input into the database"
cmd = "uv run manage.py loaddata --format=json -"

[tool.poe.tasks.release]
help = "Create a new release version."
shell = """
set -e
git diff --quiet && git diff --cached --quiet || { echo "Error: Working tree is not clean"; exit 1; }
uv version --bump=${update_type} --no-sync
version=$(uv version --short)
git add pyproject.toml uv.lock
git commit -m "Release v$version"
git tag -a "v$version" -m "Release v$version"
git push --follow-tags
"""

[[tool.poe.tasks.release.args]]
name = "update_type"
positional = true
choices= ["patch", "minor", "major", "stable", "alpha", "beta", "rc", "post", "dev"]
required = true
